name: ship-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - conda-forge::pip
  - conda-forge::python<3.13
  - conda-forge::rasterio
  - conda-forge::geopandas
  - conda-forge::gdal
  - conda-forge::pyogrio
  - conda-forge::libgdal-jp2openjpeg
  - pip:
    - fastcore
    - torch<2.11
    - torchvision
    - opencv-python
    - seaborn
    - scikit-image
    - pyarrow
    - wandb
    - tensorboard
    - captum
    - ultralytics
    - timm
    - owslib
    - openpyxl
    - albumentations
    - sahi
    - tqdm-joblib
    - git+https://github.com/waspinator/pycococreator.git
    - git+https://github.com/mayrajeo/geo2ml.git
    - omnicloudmask
    - exactextract
    - geohexgrid